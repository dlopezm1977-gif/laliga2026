name: Sync Segunda matches

on:
  workflow_dispatch:
    inputs:
      backfill:
        description: 'Sincronizar detalles de todos los partidos finalizados (histórico)'
        type: boolean
        default: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: scripts/package.json

      - name: Install dependencies
        run: npm install
        working-directory: scripts

      - name: Run sync
        env:
          BZZOIRO_TOKEN: ${{ secrets.VITE_BZZOIRO_TOKEN }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node sync-segunda.js ${{ inputs.backfill == true && '--backfill' || '' }}
        working-directory: scripts
